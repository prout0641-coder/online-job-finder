<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            JobFinder<span>AI</span>
        </div>


        <h1>
            Welcome Back
        </h1>


        <p>
            Login to your JobFinder account.
        </p>


        <input
            id="email"
            type="email"
            placeholder="Email Address"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <button onclick="login()">
            Login
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="register.html"
            class="auth-link"
        >
            Don't have an account? Register
        </a>

    </div>

</div>


<script>

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        document.getElementById("message")
            .textContent =
            "Please enter email and password.";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        email,
                        password

                    })

                }
            );


        const data =
            await response.json();


        document.getElementById("message")
            .textContent =
            data.message;


        if (response.ok) {

            localStorage.setItem(
                "token",
                data.token
            );


            localStorage.setItem(
                "userName",
                data.user.name
            );


            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                500
            );

        }

    } catch (error) {

        document.getElementById("message")
            .textContent =
            "Server connection failed.";

    }

}

</script>

</body>

</html>
