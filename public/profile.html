<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - JobFinderAI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>JobFinderAI</h2>

            <nav>

                <a href="dashboard.html">
                    🏠 Dashboard
                </a>

                <a href="profile.html">
                    👤 My Profile
                </a>

                <a href="applications.html">
                    📄 My Applications
                </a>

                <a href="#" onclick="logout()">
                    🚪 Logout
                </a>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <h1>My Profile</h1>

            <p>
                Update your information to get better job recommendations.
            </p>


            <div class="profile-card">

                <form id="profileForm">

                    <div class="form-grid">

                        <!-- FULL NAME -->
                        <div class="form-group">

                            <label for="full_name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="full_name"
                                placeholder="Enter your full name"
                            >

                        </div>


                        <!-- PHONE -->
                        <div class="form-group">

                            <label for="phone">
                                Phone
                            </label>

                            <input
                                type="text"
                                id="phone"
                                placeholder="Enter phone number"
                            >

                        </div>


                        <!-- LOCATION -->
                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                placeholder="Example: Bhubaneswar"
                            >

                        </div>


                        <!-- INDUSTRY -->
                        <div class="form-group">

                            <label for="industry">
                                Preferred Industry
                            </label>

                            <input
                                type="text"
                                id="industry"
                                placeholder="Example: IT"
                            >

                        </div>


                        <!-- MIN SALARY -->
                        <div class="form-group">

                            <label for="min_salary">
                                Minimum Salary
                            </label>

                            <input
                                type="number"
                                id="min_salary"
                                placeholder="Example: 400000"
                            >

                        </div>


                        <!-- MAX SALARY -->
                        <div class="form-group">

                            <label for="max_salary">
                                Maximum Salary
                            </label>

                            <input
                                type="number"
                                id="max_salary"
                                placeholder="Example: 800000"
                            >

                        </div>

                    </div>


                    <!-- SKILLS -->
                    <div class="form-group">

                        <label for="skills">
                            Skills
                        </label>

                        <textarea
                            id="skills"
                            placeholder="Example: Python, Java, SQL, HTML, CSS, JavaScript"
                            rows="4"
                        ></textarea>

                    </div>


                    <!-- ABOUT -->
                    <div class="form-group">

                        <label for="about">
                            About Me
                        </label>

                        <textarea
                            id="about"
                            placeholder="Tell us about yourself"
                            rows="5"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Profile
                    </button>


                    <p id="profileMessage"></p>

                </form>

            </div>

        </main>

    </div>


    <!-- IMPORTANT: JavaScript goes here -->
    <script src="js/profile.js"></script>

</body>
</html>
